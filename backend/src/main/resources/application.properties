# ============================================================
#  CryptoPulse Backend – Application Configuration
# ============================================================

# Server
server.port=8080

# Application name
spring.application.name=cryptopulse-backend

# ---------------------------------------------------------------
# CoinGecko API Configuration
# ---------------------------------------------------------------
coingecko.api.base-url=https://api.coingecko.com/api/v3
# Optional: set your CoinGecko API key here (or via env var on Render)
# coingecko.api.key=${COINGECKO_API_KEY:}

# WebClient Timeouts (milliseconds)
coingecko.api.timeout.connect=5000
coingecko.api.timeout.read=10000

# ---------------------------------------------------------------
# CORS Configuration
# ---------------------------------------------------------------
# Comma-separated list of allowed origins (set CORS_ALLOWED_ORIGINS on Render / Vercel)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------------------------------------------------------------
# Jackson Configuration
# ---------------------------------------------------------------
# Keep response JSON in camelCase (DTOs use camelCase field names)
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------
# Logging
# ---------------------------------------------------------------
logging.level.com.cryptopulse=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
